name: Bug report
description: Report reproducible incorrect behavior in eBeacon.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: eBeacon version
      description: Provide a release tag or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker image
        - Docker Compose
        - Go binary
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest sequence of requests or actions that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: Paste a minimal redacted YAML configuration. Remove credentials and private addresses.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste redacted logs covering the failure.
      render: shell
